name: HxWell Crossbyte compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Haxe 4.3.7 / ${{ matrix.target }} / Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: jvm, java: '21'}
          - {target: jvm, java: '25'}
          - {target: neko, java: '21'}
    steps:
      - name: Checkout driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout current HxWell API
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hxwell/hxwell
          ref: master
          path: dependencies/hxwell
          persist-credentials: false
      - name: Checkout tested Crossbyte snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: DimensionscapeOrg/crossbyte
          ref: acc6de8994e0292ae48706017a2eafa4acbaedbf
          path: dependencies/crossbyte
          persist-credentials: false
      - name: Checkout Emitter 2.0.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Dimensionscape/Emitter
          ref: 06b396f584271e24a7dc18dcfadfd020c567cc6a
          path: dependencies/emitter
          persist-credentials: false
      - name: Setup Haxe
        uses: krdlab/setup-haxe@18e4b483cfffca2fb8881530bf8a6cec39dac8fb # v2
        with:
          haxe-version: '4.3.7'
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y neko libsqlite3-0 openssl
          haxelib install haxe-concurrent 5.1.5 --always --quiet
          haxelib install uuid 2.4.1 --always --quiet
          haxelib install crypto 1.3.0 --always --quiet
          haxelib install hxjava 4.2.0 --always --quiet
          haxelib install utest 1.13.2 --always --quiet
          python -m pip install -r tests/requirements.txt
      - name: Test real HxWell HTTP application
        run: >-
          python tests/run.py --target ${{ matrix.target }}
          --hxwell dependencies/hxwell --crossbyte dependencies/crossbyte
          --emitter dependencies/emitter
      - name: Test HxWell core, security, SQL and schema regressions
        run: >-
          python tests/core.py --target ${{ matrix.target }}
          --hxwell dependencies/hxwell --crossbyte dependencies/crossbyte
          --emitter dependencies/emitter
      - name: Upload verification reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.target }}-java-${{ matrix.java }}
          retention-days: 14
          path: |
            out/*.json
            out/**/build.log
            out/**/server.log
            out/**/test.log
